name: Integrate cross-device repair
on:
  push:
    branches: [fix/cross-device-mobile-truth-20261001]
permissions:
  contents: write
concurrency:
  group: cross-device-repair-integration
  cancel-in-progress: true
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/cross-device-mobile-truth-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cross-device-mobile-truth-20261001
      - uses: oven-sh/setup-bun@v2
      - name: Integrate previously inspected source paths
        run: |
          python3 scripts/apply-cross-device-fixes.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('src/pages/TasksPage.tsx')
          s = p.read_text()
          assert s.count('function TaskModal(') == 1
          s = s.replace('function TaskModal(', 'export function TaskModal(')
          marker = '    </TaskDialogFrame>'
          assert s.count(marker) == 1
          s = s.replace(marker, '''      {task && onDelete && <button type="button" disabled={saving} onClick={async () => {
                  try { await onDelete(task.id); onClose(); }
                  catch { toast.error("Task could not be moved to Trash"); }
                }} className="mb-4 min-h-11 rounded-xl bg-destructive/10 px-4 text-sm text-destructive">Move to Trash</button>}
          ''' + marker)
          p.write_text(s)
          p = Path('src/lib/cloudSync.ts')
          s = p.read_text()
          start = s.index('  activeSync = (typeof navigator')
          end = s.index('\n}', start)
          s = s[:start] + '''  const operation: Promise<SyncResult> = Promise.resolve().then(async () => {
              if (typeof navigator !== 'undefined' && navigator.locks) return await navigator.locks.request('mc-cloud-sync-v2', run);
              return await run();
            }).finally(() => { activeSync = null; });
            activeSync = operation;
            return operation;''' + s[end:]
          s = s.replace('let logicalTime = 0;', 'let logicalTime = 0;\nlet localSeedChecked = false;')
          s = s.replace('    await seedMissingRecords(remote.records);', '    if (!localSeedChecked) await seedMissingRecords(remote.records);')
          s = s.replace('        const dirty = readDirty()[recordKey];', '        const dirty = readDirty()[recordKey];\n        if (!dirty && receipts[recordKey] === revisionOf(record)) continue;')
          s = s.replace('    retryAttempt = 0;\n    setStatus(', '    retryAttempt = 0;\n    localSeedChecked = true;\n    setStatus(')
          s = s.replace("    epoch++; verifiedToken = ''; remoteCache.clear(); retryAttempt = 0;", "    epoch++; verifiedToken = ''; remoteCache.clear(); retryAttempt = 0; localSeedChecked = false;")
          p.write_text(s)
          p = Path('package.json')
          package = json.loads(p.read_text())
          for name in ('build', 'build:cloudflare', 'build:netlify', 'build:dev'):
              package['scripts'][name] = 'node scripts/write-build-info.mjs && ' + package['scripts'][name]
          p.write_text(json.dumps(package, indent=2) + '\n')
          PY
      - run: bun install --frozen-lockfile
      - name: Pin browser regression dependency
        run: bun add --dev --exact playwright@1.63.0
      - run: bun run typecheck
      - name: Lint
        id: lint
        continue-on-error: true
        run: bunx eslint . --quiet
      - name: Unit and integration regressions
        id: unit
        continue-on-error: true
        run: bun run test
      - name: Cloudflare-target production build
        id: build
        continue-on-error: true
        run: bun run build:cloudflare
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit
      - name: Browser save and cross-device tests
        id: browser
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/browser-reliability.mjs')
          s = p.read_text()
          old = "  page.on('pageerror', error => console.log('Browser error:', error.stack || error.message));"
          new = r'''  page.on('pageerror', async error => {
            console.log('Browser error:', error.stack || error.message);
            const match = (error.stack || '').match(/\/assets\/([^:\s]+):(\d+):(\d+)/);
            if (match) {
              const content = await readFile(path.join(output, 'assets', match[1]), 'utf8');
              const lines = content.split('\n');
              const at = Number(match[2]);
              console.log('EXACT BUNDLE FAILURE CONTEXT:\n' + lines.slice(Math.max(0, at - 16), at + 16).map((line, i) => `${Math.max(1, at - 15) + i}: ${line}`).join('\n'));
              await writeFile('test-results/browser-failure-context.txt', lines.slice(Math.max(0, at - 80), at + 80).join('\n'));
            }
          });'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          node scripts/browser-reliability.mjs
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-device-reliability
          path: test-results/
          if-no-files-found: ignore
      - name: Require every validation gate
        if: always()
        env:
          LINT: ${{ steps.lint.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
        run: |
          test "$LINT" = success
          test "$UNIT" = success
          test "$BUILD" = success
          test "$BROWSER" = success
      - name: Commit only the tested integration and remove this one-time helper
        run: |
          git config user.name 'Mission Control repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/TaskQuickEditor.tsx src/pages/TasksPage.tsx src/layouts/DashboardLayout.tsx src/stores/dataStore.ts src/lib/cloudSync.ts src/lib/db.ts src/lib/controlCenter.server.ts src/lib/controlCenter.functions.ts src/lib/intelligenceQuality.ts src/lib/controlCenter.ts src/pages/MentionsPage.tsx src/pages/AudiencePage.tsx package.json bun.lock scripts/browser-reliability.mjs
          git rm scripts/apply-cross-device-fixes.py .github/workflows/integrate-cross-device-once.yml
          git diff --cached --check
          git commit -m 'fix: integrate tested cross-device sync, reachable mobile save and evidence diagnostics'
          git push origin HEAD:fix/cross-device-mobile-truth-20261001
