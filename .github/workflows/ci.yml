name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Pre-existing repo-wide prettier debt: reported, not yet blocking.
      - run: bun run lint
        continue-on-error: true
      - run: bun run test
      - run: bun run build
